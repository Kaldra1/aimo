name: Keep Supabase awake

# Безкоштовний проєкт Supabase ставиться на паузу після тижня без запитів.
# Пінг двічі на тиждень тримає вхід і дашборд робочими навіть на канікулах.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          URL: https://jftlshycidftaihgbnvr.supabase.co
          # Публічний ключ (той самий, що в коді сайту): доступ обмежують правила RLS.
          KEY: sb_publishable_fPm1kFWr9U-V67adtRAvaA_sklR4TZx
        run: |
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
