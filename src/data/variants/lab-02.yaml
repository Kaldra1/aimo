# Варіанти ЛР2 «Машина Тюрінга».
# Варіант N (номер у журналі): блок ((N − 1) mod 10) + 1, версія ⌈N / 10⌉.
# Кожен рівень: 10 блоків × 3 версії. Приклад: «вхід → результат», [ ] — каретка.
# Еталонні програми — у solutions/variants/lab-02.yaml (поза git). Файл згенеровано.
machine: turing
levels:
  - stars: 1
    blocks:
      - - { alphabet: "a, b, c", task: "Замінити всі букви `a` на `b`.", examples: ["[a]cab → bcbb", "[c]c → cc"] }
        - { alphabet: "0, 1", task: "Інвертувати двійкове слово: 0 замінити на 1 і навпаки.", examples: ["[0]110 → 1001", "[1] → 0"] }
        - { alphabet: "a, b, c", task: "Замінити кожну `a` на `b`, кожну `b` на `c`, а кожну `c` на `a`.", examples: ["[a]bc → bca", "[c]ca → aab"] }
      - - { alphabet: "0, 1", task: "Дописати `1` в кінець слова.", examples: ["[1]00 → 1001", "[1] → 11"] }
        - { alphabet: "a, b", task: "Дописати букву `a` на початок слова.", examples: ["[b]b → abb", "[a] → aa"] }
        - { alphabet: "a, b, c", task: "Дописати букву `c` і на початок, і в кінець слова з букв `a`, `b`.", examples: ["[a]b → cabc", "[b] → cbc"] }
      - - { alphabet: "1", task: "Збільшити унарне число на 1.", examples: ["[1]11 → 1111", "[1] → 11"] }
        - { alphabet: "1", task: "Збільшити унарне число на 2.", examples: ["[1]1 → 1111", "[1] → 111"] }
        - { alphabet: "1", task: "Зменшити унарне число на 1 (число не менше за 1; з `1` лишається порожня стрічка).", examples: ["[1]11 → 11", "[1] → λ"] }
      - - { alphabet: "0, 1", task: "Додати 1 до двійкового числа. Каретка над останньою цифрою.", examples: ["101[1] → 1100", "[1] → 10"] }
        - { alphabet: "0, 1", task: "Відняти 1 від додатного двійкового числа. Каретка над останньою цифрою; нулі на початку результату допустимі.", examples: ["110[0] → 1011", "1[1] → 10"] }
        - { alphabet: "0, 1, 2", task: "Додати 1 до числа в трійковій системі. Каретка над останньою цифрою.", examples: ["12[2] → 200", "[2] → 10"] }
      - - { alphabet: "a, b", task: "Стерти перший символ слова.", examples: ["[b]ab → ab", "[a] → λ"] }
        - { alphabet: "0, 1", task: "Стерти останній символ слова.", examples: ["[1]011 → 101", "[0] → λ"] }
        - { alphabet: "a, b, c", task: "Стерти перший і останній символи слова (у слові щонайменше два символи).", examples: ["[c]abc → ab", "[a]b → λ"] }
      - - { alphabet: "0, 1", task: "Дописати в кінець біт парності: `1`, якщо одиниць у слові непарна кількість, інакше `0`.", examples: ["[1]01 → 1010", "[1] → 11"] }
        - { alphabet: "a, b", task: "Дописати в кінець `a`, якщо букв `b` у слові парна кількість, інакше `b`.", examples: ["[a]bb → abba", "[a]b → abb"] }
        - { alphabet: "1, П, Н", task: "Дописати після унарного числа `П`, якщо воно парне, або `Н`, якщо непарне.", examples: ["[1]11 → 111Н", "[1]1 → 11П"] }
      - - { alphabet: "a, b", task: "Замінити першу (найлівішу) букву `a` на `b`; якщо `a` немає — нічого не змінювати.", examples: ["[b]bab → bbbb", "[b]b → bb"] }
        - { alphabet: "0, 1", task: "Замінити останню (найправішу) одиницю на 0; якщо одиниць немає — нічого не змінювати.", examples: ["[1]010 → 1000", "[0]0 → 00"] }
        - { alphabet: "a, b", task: "Замінити останню букву слова на протилежну (`a` ↔ `b`).", examples: ["[a]ab → aaa", "[a] → b"] }
      - - { alphabet: "0–9", task: "Додати 1 до десяткового числа. Каретка над останньою цифрою.", examples: ["19[9] → 200", "[7] → 8"] }
        - { alphabet: "0–9", task: "Відняти 1 від додатного десяткового числа. Каретка над останньою цифрою; нулі на початку результату допустимі.", examples: ["10[0] → 099", "3[5] → 34"] }
        - { alphabet: "0–7", task: "Додати 1 до числа у вісімковій системі. Каретка над останньою цифрою.", examples: ["17[7] → 200", "[6] → 7"] }
      - - { alphabet: "0, 1", task: "Якщо слово починається з `1`, дописати в кінець `1`, інакше дописати `0`.", examples: ["[1]01 → 1011", "[0]1 → 010"] }
        - { alphabet: "a, b", task: "Якщо слово закінчується буквою `a`, дописати ще одну `a`; інакше нічого не змінювати.", examples: ["[a]ba → abaa", "[a]b → ab"] }
        - { alphabet: "0, 1", task: "Стерти незначущі нулі на початку двійкового числа (у числі є хоча б одна одиниця).", examples: ["[0]0101 → 101", "[1] → 1"] }
      - - { alphabet: "1, +", task: "Обчислити суму двох унарних чисел, записаних через `+`: `11+111` → `11111`.", examples: ["[1]11+11 → 11111", "[+]1 → 1"] }
        - { alphabet: "1, *", task: "Обчислити суму двох унарних чисел, записаних через `*`: `11*111` → `11111`.", examples: ["[1]11*11 → 11111", "[*]1 → 1"] }
        - { alphabet: "1, #", task: "Обчислити суму двох унарних чисел, записаних через `#`: `11#111` → `11111`.", examples: ["[1]11#11 → 11111", "[#]1 → 1"] }
  - stars: 2
    blocks:
      - - { alphabet: "1", task: "Подвоїти унарне число: `111` → `111111`.", examples: ["[1]11 → 111111", "[1] → 11"] }
        - { alphabet: "1", task: "Потроїти унарне число: `11` → `111111`.", examples: ["[1]1 → 111111", "[1] → 111"] }
        - { alphabet: "1", task: "Обчислити $2n + 1$ для унарного числа $n$: `11` → `11111`.", examples: ["[1]1 → 11111", "[1] → 111"] }
      - - { alphabet: "1, -", task: "Обчислити різницю унарних чисел $m - n$ ($m \\ge n$), записаних як `m-n`: `1111-11` → `11`.", examples: ["[1]111-11 → 11", "[1]1-11 → λ"] }
        - { alphabet: "1, *", task: "Обчислити різницю унарних чисел $m - n$ ($m \\ge n$), записаних як `m*n`: `111*1` → `11`.", examples: ["[1]11*1 → 11", "[1]* → 1"] }
        - { alphabet: "1, -", task: "Обчислити $m - n$ для запису `m-n` унарних чисел; якщо $m < n$, результат — порожня стрічка.", examples: ["[1]11-1 → 11", "[1]-111 → λ"] }
      - - { alphabet: "0, 1", task: "Переставити символи так, щоб усі `0` стояли перед усіма `1`.", examples: ["[1]010 → 0011", "[1]10 → 011"] }
        - { alphabet: "a, b", task: "Переставити букви так, щоб усі `b` стояли перед усіма `a`.", examples: ["[a]bab → bbaa", "[a]ab → baa"] }
        - { alphabet: "a, b", task: "Переставити букви так, щоб усі `a` стояли перед усіма `b`.", examples: ["[b]aba → aabb", "[b]ba → abb"] }
      - - { alphabet: "0, 1", task: "Видалити зі слова всі нулі (решта символів зсувається, проміжків не лишається).", examples: ["[1]0010 → 11", "[0] → λ"] }
        - { alphabet: "a, b, c", task: "Видалити зі слова всі букви `a` (решта букв зсувається, проміжків не лишається).", examples: ["[a]bcab → bcb", "[a]a → λ"] }
        - { alphabet: "a, b, c", task: "Видалити зі слова всі букви `c` (решта букв зсувається, проміжків не лишається).", examples: ["[a]cbcc → ab", "[c]ab → ab"] }
      - - { alphabet: "0, 1", task: "Стерти двійкове число й записати `1`, якщо воно парне, або `0`, якщо непарне.", examples: ["[1]10 → 1", "[1] → 0"] }
        - { alphabet: "1, П, Н", task: "Замість унарного числа записати `П`, якщо воно парне, або `Н`, якщо непарне.", examples: ["[1]11 → Н", "[1]1 → П"] }
        - { alphabet: "a, b, 0, 1, 2", task: "Замість слова записати остачу від ділення кількості букв `a` на 3 (`0`, `1` або `2`).", examples: ["[a]baab → 0", "[b]b → 0"] }
      - - { alphabet: "1, *", task: "Записати після унарного числа через `*` його копію: `11` → `11*11`.", examples: ["[1]1 → 11*11", "[1] → 1*1"] }
        - { alphabet: "1, #", task: "Записати після унарного числа через `#` його копію: `111` → `111#111`.", examples: ["[1]11 → 111#111", "[1] → 1#1"] }
        - { alphabet: "1, *", task: "Записати після унарного числа $n$ через `*` число $n + 1$: `11` → `11*111`.", examples: ["[1]1 → 11*111", "[1] → 1*11"] }
      - - { alphabet: "0, 1", task: "Відняти 1 від додатного двійкового числа. Каретка над останньою цифрою; у результаті не має бути нулів на початку (крім самого числа 0).", examples: ["100[0] → 111", "[1] → 0"] }
        - { alphabet: "0, 1", task: "Додати 2 до двійкового числа. Каретка над останньою цифрою.", examples: ["101[1] → 1101", "[1] → 11"] }
        - { alphabet: "0, 1, 2", task: "Відняти 1 від додатного числа в трійковій системі. Каретка над останньою цифрою; нулі на початку допустимі.", examples: ["10[0] → 022", "2[1] → 20"] }
      - - { alphabet: "a, b", task: "Подвоїти кожну букву слова: `ab` → `aabb`.", examples: ["[a]b → aabb", "[b]ba → bbbbaa"] }
        - { alphabet: "a, b", task: "Подвоїти кожну букву `a`, букви `b` не змінювати: `aba` → `aabaa`.", examples: ["[a]ba → aabaa", "[b]b → bb"] }
        - { alphabet: "0, 1", task: "Подвоїти кожну одиницю, нулі не змінювати: `101` → `11011`.", examples: ["[1]01 → 11011", "[0]0 → 00"] }
      - - { alphabet: "a, b", task: "Перенести перший символ слова в кінець: `abb` → `bba`.", examples: ["[a]bb → bba", "[b]a → ab"] }
        - { alphabet: "a, b", task: "Перенести останній символ слова на початок: `abb` → `bab`.", examples: ["[a]bb → bab", "[b]a → ab"] }
        - { alphabet: "0, 1", task: "Перенести перший символ двійкового слова в кінець: `100` → `001`.", examples: ["[1]00 → 001", "[0]1 → 10"] }
      - - { alphabet: "a, b", task: "Стерти все, що стоїть після першої букви `b` (саму `b` залишити); якщо `b` немає — нічого не змінювати.", examples: ["[a]abab → aab", "[a]aa → aaa"] }
        - { alphabet: "a, b", task: "Стерти все до першої букви `b` включно; якщо `b` немає — стерти все.", examples: ["[a]abab → ab", "[a]a → λ"] }
        - { alphabet: "0, 1", task: "Стерти всі нулі в кінці двійкового числа (у числі є хоча б одна одиниця).", examples: ["[1]0100 → 101", "[1] → 1"] }
  - stars: 3
    blocks:
      - - { alphabet: "a, b", task: "Записати слово у зворотному порядку.", examples: ["[a]bb → bba", "[b]a → ab"] }
        - { alphabet: "0, 1", task: "Записати слово у зворотному порядку.", examples: ["[1]001 → 1001", "[1]0 → 01"] }
        - { alphabet: "a, b, c", task: "Записати слово у зворотному порядку.", examples: ["[a]bc → cba", "[c]ab → bac"] }
      - - { alphabet: "a, b, 0, 1", task: "Перевірити, чи є слово паліндромом: стерти слово й записати `1` (так) або `0` (ні).", examples: ["[a]bba → 1", "[a]b → 0"] }
        - { alphabet: "0, 1", task: "Перевірити, чи є слово паліндромом: стерти слово й записати `1` (так) або `0` (ні).", examples: ["[1]01 → 1", "[1]0 → 0"] }
        - { alphabet: "a, b, c, 0, 1", task: "Перевірити, чи є слово паліндромом: стерти слово й записати `1` (так) або `0` (ні).", examples: ["[a]bcba → 1", "[c]a → 0"] }
      - - { alphabet: "(, ), 0, 1", task: "Перевірити баланс круглих дужок: якщо дужки збалансовані, стерти слово й записати `1`, інакше — `0`.", examples: ["[(]())() → 1", "[(]))( → 0"] }
        - { alphabet: "{, }, 0, 1", task: "Перевірити баланс фігурних дужок: якщо дужки збалансовані, стерти слово й записати `1`, інакше — `0`.", examples: ["[{]{}} → 1", "[}]{ → 0"] }
        - { alphabet: "a, b, 0, 1", task: "Перевірити, чи порівну в слові букв `a` і `b`: стерти слово й записати `1` (так) або `0` (ні).", examples: ["[a]bba → 1", "[a]ab → 0"] }
      - - { alphabet: "a, b, #", task: "Записати після слова через `#` його копію: `ab` → `ab#ab`.", examples: ["[a]bb → abb#abb", "[a] → a#a"] }
        - { alphabet: "0, 1, *", task: "Записати після двійкового слова через `*` його копію: `10` → `10*10`.", examples: ["[1]01 → 101*101", "[0] → 0*0"] }
        - { alphabet: "a, b", task: "Подвоїти слово, записавши копію одразу після нього: `ab` → `abab`.", examples: ["[a]bb → abbabb", "[a] → aa"] }
      - - { alphabet: "0, 1, |", task: "Записати двійкове число в унарному вигляді паличками `|`: `101` → `|||||` (число 0 — порожня стрічка).", examples: ["[1]01 → |||||", "[1]0 → ||"] }
        - { alphabet: "|, 0, 1", task: "Записати унарне число (палички `|`) у двійковій системі: `|||||` → `101`.", examples: ["[|]|||| → 101", "[|] → 1"] }
        - { alphabet: "|, 0, 1, 2", task: "Записати унарне число (палички `|`) у трійковій системі: `|||||` → `12`.", examples: ["[|]|||| → 12", "[|]| → 2"] }
      - - { alphabet: "1, *", task: "Обчислити добуток унарних чисел, записаних через `*`: `11*111` → `111111`.", examples: ["[1]1*111 → 111111", "[1]* → λ"] }
        - { alphabet: "1, x", task: "Обчислити добуток унарних чисел, записаних через `x`: `11x111` → `111111`.", examples: ["[1]1x111 → 111111", "[1]x → λ"] }
        - { alphabet: "1, #", task: "Обчислити добуток унарних чисел, записаних через `#`: `11#111` → `111111`.", examples: ["[1]1#111 → 111111", "[1]# → λ"] }
      - - { alphabet: "1, *, >, <, =", task: "Порівняти унарні числа в записі `m*n`: стерти запис і залишити `>`, `<` або `=`.", examples: ["[1]11*1 → >", "[1]*11 → <"] }
        - { alphabet: "1, -, Б, М, Р", task: "Порівняти унарні числа в записі `m-n`: стерти запис і залишити `Б` (перше більше), `М` (менше) або `Р` (рівні).", examples: ["[1]1-1 → Б", "[-]1 → М"] }
        - { alphabet: "a, #, >, <, =", task: "Числа записано буквами `a` через `#` (`aa#aaa` — це 2 і 3). Порівняти їх: стерти запис і залишити `>`, `<` або `=`.", examples: ["[a]a#aaa → <", "[a]aa#a → >"] }
      - - { alphabet: "1", task: "Поділити унарне число на 2 націло (остачу відкинути): `11111` → `11`.", examples: ["[1]1111 → 11", "[1] → λ"] }
        - { alphabet: "1", task: "Поділити унарне число на 3 націло (остачу відкинути): `1111111` → `11`.", examples: ["[1]111111 → 11", "[1]1 → λ"] }
        - { alphabet: "1", task: "Залишити остачу від ділення унарного числа на 3: `11111` → `11`.", examples: ["[1]1111 → 11", "[1]11 → λ"] }
      - - { alphabet: "a, b, 0, 1", task: "Перевірити, чи має слово вигляд $a^n b^n$ ($n \\ge 1$): стерти слово й записати `1` (так) або `0` (ні).", examples: ["[a]abb → 1", "[a]ab → 0"] }
        - { alphabet: "0, 1", task: "Перевірити, чи має слово вигляд $0^n 1^n$ ($n \\ge 1$): стерти слово й записати `1` (так) або `0` (ні).", examples: ["[0]011 → 1", "[0]10 → 0"] }
        - { alphabet: "a, b, 0, 1", task: "Перевірити, чи має слово вигляд $a^n b^{2n}$ ($n \\ge 1$): стерти слово й записати `1` (так) або `0` (ні).", examples: ["[a]bb → 1", "[a]abb → 0"] }
      - - { alphabet: "a, b, c", task: "Упорядкувати букви за абеткою: `cabca` → `aabcc`.", examples: ["[c]abca → aabcc", "[c]ba → abc"] }
        - { alphabet: "a, b, c", task: "Упорядкувати букви у зворотному до абетки порядку: `abcab` → `cbbaa`.", examples: ["[a]bcab → cbbaa", "[a]cb → cba"] }
        - { alphabet: "0, 1, 2", task: "Упорядкувати цифри за зростанням: `2101` → `0112`.", examples: ["[2]101 → 0112", "[2]10 → 012"] }
