# Варіанти ПР-2 «Розв'язування задач на нормальні алгоритми Маркова».
# Варіант N (номер у журналі): блок ((N − 1) mod 10) + 1, версія ⌈N / 10⌉.
# Кожен рівень: 10 блоків × 3 версії. Приклад: «вхід → результат», λ — порожнє слово.
# Еталонні схеми — у solutions/variants/practical-02.yaml (поза git).
machine: markov
levels:
  - stars: 1
    blocks:
      - - { alphabet: "0, 1", task: "Відняти 1 від додатного двійкового числа (нулі на початку результату допустимі).", examples: ["100 → 011", "11 → 10"] }
        - { alphabet: "0, 1, 2", task: "Відняти 1 від додатного числа в трійковій системі (нулі на початку допустимі).", examples: ["10 → 02", "21 → 20"] }
        - { alphabet: "0, 1, 2", task: "Додати 1 до числа в трійковій системі.", examples: ["12 → 20", "22 → 100"] }
      - - { alphabet: "1", task: "Поділити унарне число на 2 націло (остачу відкинути).", examples: ["11111 → 11", "1 → λ"] }
        - { alphabet: "1", task: "Поділити унарне число на 3 націло (остачу відкинути).", examples: ["1111111 → 11", "11 → λ"] }
        - { alphabet: "1", task: "Поділити унарне число на 2 з округленням угору.", examples: ["111 → 11", "1111 → 11"] }
      - - { alphabet: "1", task: "Помножити унарне число на 2.", examples: ["111 → 111111", "λ → λ"] }
        - { alphabet: "1", task: "Помножити унарне число на 3.", examples: ["11 → 111111", "1 → 111"] }
        - { alphabet: "1", task: "Помножити унарне число на 4.", examples: ["1 → 1111", "λ → λ"] }
      - - { alphabet: "a, b", task: "Видалити дві перші букви слова (коротше слово стає порожнім).", examples: ["abba → ba", "a → λ"] }
        - { alphabet: "a, b", task: "Видалити три перші букви слова (коротше слово стає порожнім).", examples: ["ababa → ba", "ab → λ"] }
        - { alphabet: "0, 1", task: "Видалити два перші символи слова (коротше слово стає порожнім).", examples: ["1001 → 01", "1 → λ"] }
      - - { alphabet: "a, b", task: "Видалити все до першої букви `b` включно; якщо `b` немає — стерти все.", examples: ["aaba → a", "aa → λ"] }
        - { alphabet: "a, b", task: "Видалити все до першої букви `a` включно; якщо `a` немає — стерти все.", examples: ["bbab → b", "b → λ"] }
        - { alphabet: "0, 1", task: "Видалити все до першої одиниці включно; якщо одиниць немає — стерти все.", examples: ["0010 → 0", "000 → λ"] }
      - - { alphabet: "a, b", task: "Переставити дві перші букви (слово з однієї букви не змінювати).", examples: ["abb → bab", "a → a"] }
        - { alphabet: "0, 1", task: "Переставити два перші символи (слово з одного символу не змінювати).", examples: ["011 → 101", "0 → 0"] }
        - { alphabet: "a, b, c", task: "Переставити дві перші букви (слово з однієї букви не змінювати).", examples: ["cab → acb", "bb → bb"] }
      - - { alphabet: "1, -", task: "Обчислити m − n зі знаком для запису `m-n`: якщо m < n, результат починається з `-`.", examples: ["11-111 → -1", "111-1 → 11"] }
        - { alphabet: "1, *, -", task: "Обчислити m − n зі знаком для запису `m*n`: якщо m < n, результат починається з `-`.", examples: ["1*111 → -11", "11* → 11"] }
        - { alphabet: "a, #, -", task: "Числа записано буквами `a` через `#`. Обчислити m − n зі знаком (`-`, якщо m < n).", examples: ["a#aaa → -aa", "aa#a → a"] }
      - - { alphabet: "a, b, П, Н", task: "Замість слова записати `П`, якщо його довжина парна, або `Н`, якщо непарна.", examples: ["abb → Н", "λ → П"] }
        - { alphabet: "a, b, П, Н", task: "Замість слова записати `П`, якщо букв `a` у ньому парна кількість, інакше `Н`.", examples: ["abab → П", "a → Н"] }
        - { alphabet: "0, 1, П, Н", task: "Замість слова записати `П`, якщо одиниць у ньому парна кількість, інакше `Н`.", examples: ["0111 → Н", "00 → П"] }
      - - { alphabet: "0, 1", task: "Видалити всі нулі в кінці двійкового числа (число містить хоча б одну одиницю).", examples: ["10100 → 101", "100 → 1"] }
        - { alphabet: "a, b", task: "Видалити всі букви `a` в кінці слова.", examples: ["baa → b", "aa → λ"] }
        - { alphabet: "a, b", task: "Видалити всі букви `b` в кінці слова.", examples: ["abb → a", "ba → ba"] }
      - - { alphabet: "1, *", task: "Для запису `m*n` унарних чисел обчислити m + 2n.", examples: ["1*11 → 11111", "11* → 11"] }
        - { alphabet: "1, *", task: "Для запису `m*n` унарних чисел обчислити 2m + n.", examples: ["11*1 → 11111", "*11 → 11"] }
        - { alphabet: "1, *", task: "Для запису `m*n` унарних чисел обчислити m + 3n.", examples: ["1*1 → 1111", "*1 → 111"] }
  - stars: 2
    blocks:
      - - { alphabet: "a, b", task: "Перенести першу букву слова в його кінець.", examples: ["abb → bba", "ba → ab"] }
        - { alphabet: "0, 1", task: "Перенести перший символ слова в його кінець.", examples: ["100 → 001", "01 → 10"] }
        - { alphabet: "a, c", task: "Перенести першу букву слова в його кінець.", examples: ["acc → cca", "ca → ac"] }
      - - { alphabet: "0, 1, |", task: "Записати двійкове число в унарному вигляді паличками `|`.", examples: ["101 → |||||", "10 → ||"] }
        - { alphabet: "0, 1, 2, |", task: "Записати число з трійкової системи в унарному вигляді паличками `|`.", examples: ["12 → |||||", "20 → ||||||"] }
        - { alphabet: "0, 1, |", task: "Записати подвоєне двійкове число в унарному вигляді паличками `|`.", examples: ["101 → ||||||||||", "1 → ||"] }
      - - { alphabet: "a, b, c", task: "Замінити на `c` кожну другу букву слова (другу, четверту, …).", examples: ["abab → acac", "b → b"] }
        - { alphabet: "a, b, c", task: "Замінити на `c` кожну третю букву слова (третю, шосту, …).", examples: ["aaab → aacb", "ab → ab"] }
        - { alphabet: "0, 1", task: "Інвертувати кожен другий символ слова (другий, четвертий, …).", examples: ["0000 → 0101", "11 → 10"] }
      - - { alphabet: "1, *", task: "Поділити унарне число на 2 з остачею й записати результат як `частка*остача`.", examples: ["11111 → 11*1", "11 → 1*"] }
        - { alphabet: "1, *", task: "Поділити унарне число на 3 з остачею й записати результат як `частка*остача`.", examples: ["1111111 → 11*1", "11 → *11"] }
        - { alphabet: "1, *", task: "Поділити унарне число на 4 з остачею й записати результат як `частка*остача`.", examples: ["111111 → 1*11", "1111 → 1*"] }
      - - { alphabet: "a, b", task: "Видалити першу й останню букви слова (слово з однієї букви стає порожнім).", examples: ["abab → ba", "a → λ"] }
        - { alphabet: "a, b", task: "Видалити дві останні букви слова (коротше слово стає порожнім).", examples: ["abba → ab", "a → λ"] }
        - { alphabet: "0, 1", task: "Видалити перший і останній символи слова (слово з одного символу стає порожнім).", examples: ["10110 → 011", "01 → λ"] }
      - - { alphabet: "1, *", task: "Для запису `m*n` унарних чисел залишити більше з них.", examples: ["111*11 → 111", "1*11 → 11"] }
        - { alphabet: "1, *", task: "Для запису `m*n` унарних чисел залишити менше з них.", examples: ["111*11 → 11", "1*111 → 1"] }
        - { alphabet: "a, #", task: "Числа записано буквами `a` через `#`. Залишити більше з них.", examples: ["aa#aaa → aaa", "a# → a"] }
      - - { alphabet: "a, b", task: "Поміняти місцями букви в кожній парі: першу з другою, третю з четвертою… Остання непарна буква лишається.", examples: ["abab → baba", "aba → baa"] }
        - { alphabet: "0, 1", task: "Поміняти місцями символи в кожній парі: перший з другим, третій з четвертим… Останній непарний лишається.", examples: ["0110 → 1001", "011 → 101"] }
        - { alphabet: "a, b", task: "У кожній парі букв (перша й друга, третя й четверта, …) поставити `b` першою. Остання непарна буква лишається.", examples: ["abab → baba", "baab → baba"] }
      - - { alphabet: "a, b", task: "Видалити всі букви `b`, що стоять після першої букви `a`.", examples: ["babba → baa", "bbb → bbb"] }
        - { alphabet: "a, b", task: "Видалити всі букви `a`, що стоять після першої букви `b`.", examples: ["abaab → abb", "aa → aa"] }
        - { alphabet: "0, 1", task: "Видалити всі нулі, що стоять після першої одиниці.", examples: ["01001 → 011", "000 → 000"] }
      - - { alphabet: "a, b", task: "Видалити букву, що стоїть безпосередньо перед першою `b` (якщо така є).", examples: ["aab → ab", "ba → ba"] }
        - { alphabet: "a, b", task: "Видалити букву, що стоїть безпосередньо після першої `b` (якщо така є).", examples: ["abab → abb", "ab → ab"] }
        - { alphabet: "0, 1", task: "Видалити символ, що стоїть безпосередньо перед першою одиницею (якщо такий є).", examples: ["0011 → 011", "10 → 10"] }
      - - { alphabet: "a, b", task: "Дописати в кінець слова копію його першої букви.", examples: ["abb → abba", "b → bb"] }
        - { alphabet: "0, 1", task: "Дописати в кінець слова копію його першого символу.", examples: ["011 → 0110", "1 → 11"] }
        - { alphabet: "a, b", task: "Дописати в кінець слова букву, протилежну першій (`a` ↔ `b`).", examples: ["abb → abbb", "ba → baa"] }
  - stars: 3
    blocks:
      - - { alphabet: "1, 0, 2", task: "Записати унарне число в трійковій системі (нуль — `0`).", examples: ["1111 → 11", "111 → 10"] }
        - { alphabet: "1, 0, 2, 3", task: "Записати унарне число в четвірковій системі (нуль — `0`).", examples: ["11111 → 11", "1111 → 10"] }
        - { alphabet: "1, 0, 2, 3, 4", task: "Записати унарне число в п’ятірковій системі (нуль — `0`).", examples: ["111111 → 11", "11111 → 10"] }
      - - { alphabet: "1, *", task: "Записати перед унарним числом його копію через `*`.", examples: ["111 → 111*111", "λ → *"] }
        - { alphabet: "1, *", task: "Записати перед унарним числом його подвоєну копію через `*`.", examples: ["11 → 1111*11", "1 → 11*1"] }
        - { alphabet: "1, *", task: "Записати перед унарним числом n число n + 1 через `*`.", examples: ["11 → 111*11", "λ → 1*"] }
      - - { alphabet: "a, b", task: "Перенести останню букву слова на його початок.", examples: ["abb → bab", "a → a"] }
        - { alphabet: "0, 1", task: "Перенести останній символ слова на його початок.", examples: ["001 → 100", "10 → 01"] }
        - { alphabet: "a, c", task: "Перенести останню букву слова на його початок.", examples: ["aac → caa", "ca → ac"] }
      - - { alphabet: "a, b, =", task: "Замість слова записати букву, якої в ньому більше (`a` або `b`), або `=`, якщо порівну.", examples: ["aabab → a", "abba → ="] }
        - { alphabet: "0, 1, =", task: "Замість слова записати символ, якого в ньому більше (`0` або `1`), або `=`, якщо порівну.", examples: ["0101 → =", "1101 → 1"] }
        - { alphabet: "x, y, =", task: "Замість слова записати букву, якої в ньому більше (`x` або `y`), або `=`, якщо порівну.", examples: ["yxy → y", "xy → ="] }
      - - { alphabet: "a, b, *", task: "Записати перед словом його копію через `*`.", examples: ["ab → ab*ab", "λ → *"] }
        - { alphabet: "0, 1, *", task: "Записати перед словом його копію через `*`.", examples: ["10 → 10*10", "0 → 0*0"] }
        - { alphabet: "a, b, *", task: "Записати перед словом його копію через `*`, замінивши в копії `a` ↔ `b`.", examples: ["aab → bba*aab", "b → a*b"] }
      - - { alphabet: "a, b, 1, =", task: "Записати перед словом кількість букв `a` в унарному вигляді і знак `=`.", examples: ["abab → 11=abab", "bb → =bb"] }
        - { alphabet: "a, b, 1, =", task: "Записати перед словом кількість букв `b` в унарному вигляді і знак `=`.", examples: ["bab → 11=bab", "a → =a"] }
        - { alphabet: "0, 1, =", task: "Записати перед словом кількість одиниць у ньому (в унарному вигляді) і знак `=`.", examples: ["0110 → 11=0110", "0 → =0"] }
      - - { alphabet: "a, b", task: "Залишити лише букви на місцях, кратних трьом (третю, шосту, …).", examples: ["abbaab → bb", "ab → λ"] }
        - { alphabet: "a, b", task: "Видалити букви на місцях, кратних трьом (третю, шосту, …).", examples: ["abbaab → abaa", "aab → aa"] }
        - { alphabet: "0, 1", task: "Залишити лише символи на місцях, кратних трьом (третій, шостий, …).", examples: ["110011 → 01", "1 → λ"] }
      - - { alphabet: "a, b", task: "Подвоїти кожну букву, крім останньої.", examples: ["aba → aabba", "b → b"] }
        - { alphabet: "a, b", task: "Подвоїти кожну букву, крім першої.", examples: ["aba → abbaa", "a → a"] }
        - { alphabet: "0, 1", task: "Подвоїти кожен символ, крім останнього.", examples: ["101 → 11001", "0 → 0"] }
      - - { alphabet: "0, 1", task: "Інвертувати всі символи, що стоять після першої одиниці.", examples: ["0101 → 0110", "000 → 000"] }
