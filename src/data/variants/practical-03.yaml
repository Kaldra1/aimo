    blocks:
      - - { task: "Напишіть функцію підрахунку інверсій і перевірте на 1000 випадкових масивах, що кількість обмінів бульбашки й зсувів вставок дорівнює кількості інверсій." }
        - { task: "Напишіть функцію підрахунку інверсій і перевірте на 1000 випадкових масивах з повторами (значення 0–5), що кількість обмінів бульбашки й зсувів вставок дорівнює кількості інверсій." }
        - { task: "Напишіть функцію підрахунку інверсій і перевірте на 1000 майже відсортованих масивах (5 % випадкових обмінів), що обміни бульбашки й зсуви вставок дорівнюють кількості інверсій." }
      - - { task: "Реалізуйте шейкерне сортування з прапорцем і двома межами, що звужуються. Порівняйте його з бульбашкою за кількістю порівнянь на випадкових масивах для n = 100, 1000, 10 000." }
        - { task: "Реалізуйте шейкерне сортування з прапорцем і двома межами, що звужуються. Порівняйте його з бульбашкою за кількістю порівнянь на відсортованих масивах для n = 100, 1000, 10 000." }
        - { task: "Реалізуйте шейкерне сортування з прапорцем і двома межами, що звужуються. Порівняйте його з бульбашкою за кількістю порівнянь на зворотних масивах для n = 100, 1000, 10 000." }
      - - { task: "Реалізуйте сортування вставками однозв’язного списку (`struct Node { int value; Node* next; }`) за зростанням, переставляючи вузли, а не значення." }
        - { task: "Реалізуйте сортування вставками однозв’язного списку (`struct Node { int value; Node* next; }`) за спаданням, переставляючи вузли, а не значення." }
        - { task: "Реалізуйте сортування вставками однозв’язного списку рядків (`struct Node { string value; Node* next; }`) за абеткою, переставляючи вузли." }
      - - { task: "Напишіть універсальну функцію сортування бульбашкою, яка приймає компаратор (вказівник на функцію або лямбду). Продемонструйте три порядки: за зростанням, за спаданням, за модулем." }
        - { task: "Напишіть універсальну функцію сортування вибором, яка приймає компаратор (вказівник на функцію або лямбду). Продемонструйте три порядки: за зростанням, за спаданням, за модулем." }
        - { task: "Напишіть універсальну функцію сортування вставками, яка приймає компаратор (вказівник на функцію або лямбду). Продемонструйте три порядки: за зростанням, за спаданням, за модулем." }
      - - { task: "Реалізуйте «гномове» сортування (gnome sort). Порівняйте кількість порівнянь і переміщень зі звичайними вставками на випадкових масивах n = 100 і поясніть схожість." }
        - { task: "Реалізуйте сортування «парних-непарних» обмінів (odd–even transposition sort). Порівняйте кількість проходів і обмінів з бульбашкою на випадкових масивах n = 100." }
        - { task: "Реалізуйте сортування циклами (cycle sort), що мінімізує кількість записів у масив. Порівняйте кількість записів із вибором і вставками на випадкових масивах n = 100." }
      - - { task: "Знайдіть k найменших елементів, виконавши лише k кроків сортування вибором. Порівняйте кількість порівнянь із повним сортуванням для n = 1000 і k = 1, 10, 100." }
        - { task: "Знайдіть k найбільших елементів, виконавши лише k проходів бульбашки. Порівняйте кількість порівнянь із повним сортуванням для n = 1000 і k = 1, 10, 100." }
        - { task: "Знайдіть k найменших елементів, підтримуючи впорядкований вставками масив розміру k. Порівняйте кількість порівнянь із повним сортуванням для n = 1000 і k = 1, 10, 100." }
      - - { task: "Відсортуйте матрицю 5 × 6 «змійкою»: прочитані змійкою (рядок зліва направо, наступний — справа наліво) елементи мають іти за зростанням." }
        - { task: "Переставте рядки матриці 6 × 5 за зростанням суми їхніх елементів (рядки переміщуйте цілком, без копіювання поелементно)." }
        - { task: "Переставте стовпці матриці 5 × 6 за зростанням елементів першого рядка (стовпці переміщуйте цілком)." }
      - - { task: "Напишіть програму, яка автоматично перевіряє стійкість бульбашки, вибору й вставок на 1000 випадкових масивах записів (ключ 0–9 і порядковий номер)." }
        - { task: "Напишіть програму, яка автоматично перевіряє стійкість бульбашки, вибору й вставок, сортуючи записи спершу за другим ключем, потім за першим, і перевіряючи результат." }
        - { task: "Напишіть програму, яка автоматично перевіряє стійкість бульбашки, вибору, вставок і шейкерного сортування на 1000 випадкових масивах записів." }
      - - { task: "Прочитайте рядки з текстового файлу, відсортуйте їх бульбашкою за довжиною, а за однакової довжини — за абеткою, і запишіть у новий файл." }
        - { task: "Прочитайте рядки з текстового файлу, відсортуйте їх вибором за довжиною, а за однакової довжини — за абеткою, і запишіть у новий файл." }
        - { task: "Прочитайте рядки з текстового файлу, відсортуйте їх вставками за довжиною, а за однакової довжини — за абеткою, і запишіть у новий файл." }
      - - { task: "Відсортуйте масив зі значень 0, 1 і 2 за один прохід (задача «прапора Нідерландів»). Порівняйте кількість обмінів зі вставками." }
        - { task: "Відсортуйте масив символів з букв `a`, `b` і `c` за один прохід (задача «прапора Нідерландів»). Порівняйте кількість обмінів зі вставками." }
        - { task: "Переставте масив так, щоб спершу йшли від’ємні, потім нулі, потім додатні — за один прохід. Порівняйте кількість обмінів зі вставками." }
