# Варіанти ПЗ1 «Побудова нормальних алгоритмів Маркова».
# Варіант N (номер у журналі): блок ((N − 1) mod 10) + 1, версія ⌈N / 10⌉.
# Кожен рівень: 10 блоків × 3 версії. Приклад: «вхід → результат», λ — порожнє слово.
# Еталонні схеми — у solutions/variants/practical-01.yaml (поза git).
machine: markov
levels:
  - stars: 1
    blocks:
      - - { alphabet: "a, b, c", task: "Замінити всі букви `c` на `a`.", examples: ["acbc → aaba", "ccc → aaa"] }
        - { alphabet: "a, b, c", task: "Замінити всі букви `a` на `c`.", examples: ["abca → cbcc", "bb → bb"] }
        - { alphabet: "a, b, c", task: "Замінити всі букви `b` на `c`.", examples: ["abba → acca", "cab → cac"] }
      - - { alphabet: "a, b", task: "Видалити зі слова всі букви `a`.", examples: ["abab → bb", "aaa → λ"] }
        - { alphabet: "a, b, c", task: "Видалити зі слова всі букви `c`.", examples: ["acbcc → ab", "cab → ab"] }
        - { alphabet: "0, 1", task: "Видалити зі слова всі нулі.", examples: ["10010 → 11", "000 → λ"] }
      - - { alphabet: "a, b", task: "Дописати букву `a` на початок слова.", examples: ["bb → abb", "λ → a"] }
        - { alphabet: "a, b", task: "Дописати `ab` на початок слова.", examples: ["ba → abba", "λ → ab"] }
        - { alphabet: "0, 1", task: "Дописати `00` на початок слова.", examples: ["1 → 001", "10 → 0010"] }
      - - { alphabet: "1", task: "Збільшити унарне число на 2.", examples: ["111 → 11111", "λ → 11"] }
        - { alphabet: "1", task: "Збільшити унарне число на 3.", examples: ["1 → 1111", "λ → 111"] }
        - { alphabet: "1", task: "Збільшити унарне число на 4.", examples: ["11 → 111111", "λ → 1111"] }
      - - { alphabet: "1", task: "Зменшити унарне число на 1 (число не менше за 1).", examples: ["111 → 11", "1 → λ"] }
        - { alphabet: "1", task: "Зменшити унарне число на 2 (число не менше за 2).", examples: ["1111 → 11", "11 → λ"] }
        - { alphabet: "1", task: "Зменшити унарне число на 3 (число не менше за 3).", examples: ["11111 → 11", "111 → λ"] }
      - - { alphabet: "0, 1", task: "Замінювати пари `00` на `1`, доки в слові є такі пари.", examples: ["0000 → 11", "1000 → 110"] }
        - { alphabet: "0, 1", task: "Замінювати пари `11` на `0`, доки в слові є такі пари.", examples: ["1111 → 00", "0111 → 001"] }
        - { alphabet: "a, b, c", task: "Замінювати `ab` на `c`, доки в слові є такий фрагмент.", examples: ["abab → cc", "aabb → acb"] }
      - - { alphabet: "1, +", task: "Обчислити суму двох унарних чисел, розділених знаком `+`.", examples: ["111+11 → 11111", "+1 → 1"] }
        - { alphabet: "1, *", task: "Обчислити суму двох унарних чисел, розділених знаком `*`.", examples: ["1*111 → 1111", "11* → 11"] }
        - { alphabet: "1, #", task: "Обчислити суму двох унарних чисел, розділених знаком `#`.", examples: ["11#11 → 1111", "# → λ"] }
      - - { alphabet: "a, b", task: "Кожну групу однакових сусідніх букв `a` замінити однією `a`.", examples: ["aabaaa → aba", "aaaa → a"] }
        - { alphabet: "a, b", task: "Кожну групу однакових сусідніх букв `b` замінити однією `b`.", examples: ["abbbab → abab", "bb → b"] }
        - { alphabet: "0, 1", task: "Кожну групу сусідніх одиниць замінити однією одиницею.", examples: ["0110111 → 0101", "111 → 1"] }
      - - { alphabet: "a, b", task: "Замінити на `b` лише першу (найлівішу) букву `a`.", examples: ["baab → bbab", "bbb → bbb"] }
        - { alphabet: "a, b", task: "Замінити на `a` лише першу (найлівішу) букву `b`.", examples: ["abba → aaba", "aa → aa"] }
        - { alphabet: "0, 1", task: "Замінити на `1` лише перший (найлівіший) нуль.", examples: ["1001 → 1101", "111 → 111"] }
      - - { alphabet: "a, b", task: "Переставити букви так, щоб усі `a` стояли перед усіма `b`.", examples: ["baba → aabb", "bba → abb"] }
        - { alphabet: "a, b", task: "Переставити букви так, щоб усі `b` стояли перед усіма `a`.", examples: ["abab → bbaa", "aab → baa"] }
        - { alphabet: "0, 1", task: "Переставити символи так, щоб усі нулі стояли перед усіма одиницями.", examples: ["1010 → 0011", "110 → 011"] }
  - stars: 2
    blocks:
      - - { alphabet: "a, b", task: "Дописати букву `a` в кінець слова.", examples: ["bb → bba", "λ → a"] }
        - { alphabet: "0, 1", task: "Дописати `1` в кінець слова.", examples: ["10 → 101", "λ → 1"] }
        - { alphabet: "a, b, c", task: "Дописати букву `c` в кінець слова.", examples: ["ab → abc", "c → cc"] }
      - - { alphabet: "a, b", task: "Видалити першу букву слова (порожнє слово лишити порожнім).", examples: ["bab → ab", "λ → λ"] }
        - { alphabet: "a, b, c", task: "Видалити першу букву слова (порожнє слово лишити порожнім).", examples: ["cab → ab", "a → λ"] }
        - { alphabet: "0, 1", task: "Видалити перший символ слова (порожнє слово лишити порожнім).", examples: ["100 → 00", "1 → λ"] }
      - - { alphabet: "1", task: "Подвоїти унарне число.", examples: ["111 → 111111", "λ → λ"] }
        - { alphabet: "1", task: "Потроїти унарне число.", examples: ["11 → 111111", "1 → 111"] }
        - { alphabet: "1", task: "Обчислити 2n + 1 для унарного числа n.", examples: ["11 → 11111", "λ → 1"] }
      - - { alphabet: "0, 1", task: "Інвертувати двійкове слово: 0 замінити на 1 і навпаки.", examples: ["0110 → 1001", "λ → λ"] }
        - { alphabet: "a, b", task: "Замінити кожну `a` на `b`, а кожну `b` на `a`.", examples: ["aab → bba", "b → a"] }
        - { alphabet: "a, b, c", task: "Поміняти місцями букви `a` і `b`, букви `c` не змінювати.", examples: ["acb → bca", "cc → cc"] }
      - - { alphabet: "a, b", task: "Подвоїти кожну букву `a`, букви `b` не змінювати.", examples: ["aba → aabaa", "bb → bb"] }
        - { alphabet: "a, b", task: "Подвоїти кожну букву `b`, букви `a` не змінювати.", examples: ["abb → abbbb", "a → a"] }
        - { alphabet: "a, b", task: "Подвоїти кожну букву слова.", examples: ["ab → aabb", "ba → bbaa"] }
      - - { alphabet: "1, -", task: "Обчислити різницю m − n унарних чисел, записаних як `m-n` (m ≥ n).", examples: ["1111-1 → 111", "11-11 → λ"] }
        - { alphabet: "1, *", task: "Обчислити різницю m − n унарних чисел, записаних як `m*n` (m ≥ n).", examples: ["111*1 → 11", "1* → 1"] }
        - { alphabet: "1, -", task: "Обчислити m − n для запису `m-n`; якщо m < n, результат — порожнє слово.", examples: ["111-1 → 11", "11-111 → λ"] }
      - - { alphabet: "a, b", task: "Замінити кожну букву `a` на `ab`.", examples: ["aba → abbab", "b → b"] }
        - { alphabet: "a, b", task: "Замінити кожну букву `b` на `ba`.", examples: ["bab → baaba", "a → a"] }
        - { alphabet: "0, 1", task: "Замінити кожен нуль на `01`.", examples: ["010 → 01101", "1 → 1"] }
      - - { alphabet: "1, П, Н", task: "Замість унарного числа записати `П`, якщо воно парне, або `Н`, якщо непарне.", examples: ["111 → Н", "λ → П"] }
        - { alphabet: "1, a, b, c", task: "Замість унарного числа записати остачу від ділення на 3: `a` — 0, `b` — 1, `c` — 2.", examples: ["1111 → b", "11 → c"] }
        - { alphabet: "1, a, b, c, d", task: "Замість унарного числа записати остачу від ділення на 4: `a` — 0, `b` — 1, `c` — 2, `d` — 3.", examples: ["11111 → b", "111 → d"] }
      - - { alphabet: "0, 1", task: "Видалити незначущі нулі на початку двійкового числа; число з самих нулів стає `0`.", examples: ["00101 → 101", "000 → 0"] }
        - { alphabet: "a, b", task: "Видалити всі букви `a` на початку слова.", examples: ["aabab → bab", "aa → λ"] }
        - { alphabet: "a, b", task: "Видалити всі букви `b` на початку слова.", examples: ["bba → a", "abb → abb"] }
      - - { alphabet: "a, b, (, )", task: "Взяти слово в дужки.", examples: ["ab → (ab)", "λ → ()"] }
        - { alphabet: "a, b, c", task: "Дописати букву `c` і на початок, і в кінець слова з букв `a`, `b`.", examples: ["ab → cabc", "b → cbc"] }
        - { alphabet: "0, 1", task: "Дописати `0` на початок і `1` в кінець слова.", examples: ["11 → 0111", "λ → 01"] }
  - stars: 3
    blocks:
      - - { alphabet: "a, b", task: "Видалити останню букву слова (порожнє слово лишити порожнім).", examples: ["abb → ab", "λ → λ"] }
        - { alphabet: "a, b, c", task: "Видалити останню букву слова (порожнє слово лишити порожнім).", examples: ["cab → ca", "c → λ"] }
        - { alphabet: "0, 1", task: "Видалити останній символ слова (порожнє слово лишити порожнім).", examples: ["1011 → 101", "0 → λ"] }
      - - { alphabet: "a, b", task: "Залишити лише останню букву слова.", examples: ["abab → b", "ba → a"] }
        - { alphabet: "a, b", task: "Залишити лише першу букву слова.", examples: ["baab → b", "ab → a"] }
        - { alphabet: "0, 1", task: "Залишити лише останній символ слова.", examples: ["0110 → 0", "01 → 1"] }
      - - { alphabet: "a, b", task: "Видалити букви на парних місцях (другу, четверту, …).", examples: ["abab → aa", "b → b"] }
        - { alphabet: "a, b", task: "Видалити букви на непарних місцях (першу, третю, …).", examples: ["abab → bb", "a → λ"] }
        - { alphabet: "0, 1", task: "Видалити символи на парних місцях (другий, четвертий, …).", examples: ["10110 → 110", "01 → 0"] }
      - - { alphabet: "a, b, c", task: "Упорядкувати букви за абеткою.", examples: ["cabca → aabcc", "cba → abc"] }
        - { alphabet: "a, b, c", task: "Упорядкувати букви у зворотному до абетки порядку.", examples: ["abcab → cbbaa", "acb → cba"] }
        - { alphabet: "0, 1, 2", task: "Упорядкувати цифри за зростанням.", examples: ["2101 → 0112", "210 → 012"] }
      - - { alphabet: "1, *, >, <, =", task: "Порівняти унарні числа в записі `m*n`: залишити `>`, `<` або `=`.", examples: ["111*1 → >", "1*11 → <"] }
        - { alphabet: "1, -, Б, М, Р", task: "Порівняти унарні числа в записі `m-n`: залишити `Б` (перше більше), `М` (менше) або `Р` (рівні).", examples: ["11-1 → Б", "-1 → М"] }
        - { alphabet: "a, #, >, <, =", task: "Числа записано буквами `a` (`aaa` — 3) через `#`. Порівняти їх: залишити `>`, `<` або `=`.", examples: ["aa#aaa → <", "aaa#a → >"] }
      - - { alphabet: "a, b", task: "Стерти все, що стоїть після першої букви `b` (саму `b` залишити).", examples: ["aabab → aab", "aaa → aaa"] }
        - { alphabet: "a, b", task: "Стерти все, що стоїть після першої букви `a` (саму `a` залишити).", examples: ["bbaab → bba", "bb → bb"] }
        - { alphabet: "0, 1", task: "Стерти все, що стоїть після першої одиниці (саму одиницю залишити).", examples: ["00101 → 001", "000 → 000"] }
      - - { alphabet: "a, b, -", task: "Вставити дефіс між кожними двома сусідніми буквами.", examples: ["abb → a-b-b", "a → a"] }
        - { alphabet: "a, b, +", task: "Вставити `+` між кожними двома сусідніми буквами.", examples: ["ba → b+a", "aab → a+a+b"] }
        - { alphabet: "0, 1, -", task: "Вставити дефіс між кожними двома сусідніми символами.", examples: ["101 → 1-0-1", "λ → λ"] }
      - - { alphabet: "0, 1", task: "Дописати в кінець біт парності: `1`, якщо одиниць у слові непарна кількість, інакше `0`.", examples: ["101 → 1010", "1 → 11"] }
        - { alphabet: "0, 1", task: "Інвертувати слово й дописати в кінець біт парності кількості одиниць у вхідному слові.", examples: ["101 → 0100", "1 → 01"] }
        - { alphabet: "a, b", task: "Дописати в кінець `a`, якщо букв `b` у слові парна кількість, інакше `b`.", examples: ["abb → abba", "ab → abb"] }
      - - { alphabet: "1, П, Н", task: "Дописати після унарного числа `П`, якщо воно парне, або `Н`, якщо непарне.", examples: ["111 → 111Н", "λ → П"] }
        - { alphabet: "1, a, b, c", task: "Дописати після унарного числа остачу від ділення на 3: `a` — 0, `b` — 1, `c` — 2.", examples: ["1111 → 1111b", "111 → 111a"] }
        - { alphabet: "1, a, b, c, d", task: "Дописати після унарного числа остачу від ділення на 4: `a` — 0, `b` — 1, `c` — 2, `d` — 3.", examples: ["11111 → 11111b", "11 → 11c"] }
      - - { alphabet: "a, b", task: "Подвоїти останню букву слова.", examples: ["ab → abb", "λ → λ"] }
        - { alphabet: "a, b", task: "Замінити останню букву слова на протилежну (`a` ↔ `b`).", examples: ["aab → aaa", "a → b"] }
        - { alphabet: "0, 1", task: "Подвоїти останній символ слова.", examples: ["10 → 100", "1 → 11"] }
