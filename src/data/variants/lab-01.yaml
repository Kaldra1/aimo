        - { task: "Два масиви розділені кількома порожніми комірками. Стерти правий масив.", examples: ["[1] 1 0^3 1^3 → 1^2", "[1] 0 1 → 1"] }
      - - { task: "Каретка стоїть на порожній комірці між двома масивами (на невідомій відстані від обох). Стерти останню мітку лівого масиву.", examples: ["1^2 0 [0] 0 1^2 → 1 0^4 1^2", "1 0 [0] 0 1 → 1"] }
