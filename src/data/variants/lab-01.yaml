        - { task: "Поділити масив з $m$ міток на 3 з остачею: ліворуч записати частку (масив з $\\lfloor m/3 \\rfloor$ міток), а праворуч від неї через одну порожню комірку — остачу (масив з $m \\bmod 3$ міток). Порожню частку чи остачу не записувати.", examples: ["[1] 1^6 → 1^2 0 1", "[1] 1 → 1^2"] }
        - { task: "Поділити масив з $m$ міток на 4 з остачею: ліворуч записати частку (масив з $\\lfloor m/4 \\rfloor$ міток), а праворуч від неї через одну порожню комірку — остачу (масив з $m \\bmod 4$ міток). Порожню частку чи остачу не записувати.", examples: ["[1] 1^8 → 1^2 0 1", "[1] 1^2 → 1^3"] }
