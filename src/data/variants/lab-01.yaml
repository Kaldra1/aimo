# Варіанти ЛР1 «Машина Поста».
# Варіант N (номер у журналі): блок ((N − 1) mod 10) + 1, версія ⌈N / 10⌉.
# Кожен рівень: 10 блоків × 3 версії. Приклад: «вхід → результат» у нотації емулятора.
# Еталонні програми — у solutions/variants/lab-01.yaml (поза git). Файл згенеровано.
machine: post
levels:
  - stars: 1
    blocks:
      - - { task: "Збільшити число на 1.", examples: ["[1] 1^2 → 1^4", "[1] → 1^2"] }
        - { task: "Збільшити число на 2.", examples: ["[1] 1^2 → 1^5", "[1] → 1^3"] }
        - { task: "Збільшити число на 3.", examples: ["[1] 1^2 → 1^6", "[1] → 1^4"] }
