<svg xmlns="http://www.w3.org/2000/svg" width="720" viewBox="0 0 720 380" font-family="Inter, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><title>Точки золотого перетину та повторне використання точки</title><text x="360" y="35" text-anchor="middle" fill="#122120" font-size="20">Поділ інтервалу золотим перетином</text><path d="M 60 100 H 660" stroke="#122120" stroke-width="3"/><path d="M 60 220 H 430.82039324993696" stroke="#0D6E63" stroke-width="4"/><circle cx="60" cy="100" r="5" fill="#0D6E63"/><text x="60" y="76" text-anchor="middle" fill="#122120" font-size="15">a</text><circle cx="289.17960675006304" cy="100" r="5" fill="#0D6E63"/><text x="289.17960675006304" y="76" text-anchor="middle" fill="#122120" font-size="15">x₁ = a + (1 − τ)L</text><circle cx="430.82039324993696" cy="100" r="5" fill="#0D6E63"/><text x="430.82039324993696" y="76" text-anchor="middle" fill="#122120" font-size="15">x₂ = a + τL</text><circle cx="660" cy="100" r="5" fill="#0D6E63"/><text x="660" y="76" text-anchor="middle" fill="#122120" font-size="15">b</text><path d="M 289.17960675006304 111 V 128 M 289.17960675006304 171 V 207" stroke="#E8A33D" stroke-width="2" stroke-dasharray="5 4"/><circle cx="289.17960675006304" cy="220" r="6" fill="#E8A33D"/><circle cx="201.64078649987383" cy="220" r="5" fill="#0D6E63"/><text x="201.64078649987383" y="248" text-anchor="middle" fill="#0D6E63" font-size="15">нова точка</text><text x="289.17960675006304" y="274" text-anchor="middle" fill="#122120" font-size="15">стара x₁ → нова x₂</text><text x="60" y="248" text-anchor="middle" fill="#122120" font-size="15">a</text><text x="430.82039324993696" y="248" text-anchor="middle" fill="#122120" font-size="15">нове b</text><text x="360" y="155" text-anchor="middle" fill="#6B8480" font-size="17">Якщо f(x₁) ≤ f(x₂), зберігаємо [a, x₂]</text><text x="360" y="320" text-anchor="middle" fill="#0D6E63" font-size="18">Нова довжина: τL; τ² = 1 − τ</text><text x="360" y="352" text-anchor="middle" fill="#6B8480" font-size="16">Значення функції у збереженій точці вже відоме</text></svg>