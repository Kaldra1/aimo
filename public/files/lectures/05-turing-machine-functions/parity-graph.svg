<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, Arial, sans-serif" font-size="15" fill="#122120">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#122120"/>
    </marker>
  </defs>
  <!-- стартова стрілка -->
  <line x1="70" y1="120" x2="166" y2="120" stroke="#122120" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="112" y="108" text-anchor="middle" font-size="13" fill="#6B8480">старт</text>
  <!-- q0 → q1 -->
  <path d="M 226 100 Q 320 40 414 100" fill="none" stroke="#122120" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="58" text-anchor="middle" fill="#0D6E63">1 / λ, R</text>
  <!-- q1 → q0 -->
  <path d="M 414 140 Q 320 200 226 140" fill="none" stroke="#122120" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="194" text-anchor="middle" fill="#0D6E63">1 / λ, R</text>
  <!-- стани -->
  <circle cx="200" cy="120" r="32" fill="#DDEFEB" stroke="#122120" stroke-width="1.5"/>
  <text x="200" y="121" text-anchor="middle" dominant-baseline="middle" font-size="18">q₀</text>
  <circle cx="440" cy="120" r="32" fill="#DDEFEB" stroke="#122120" stroke-width="1.5"/>
  <text x="440" y="121" text-anchor="middle" dominant-baseline="middle" font-size="18">q₁</text>
  <!-- переходи в зупинку -->
  <line x1="218" y1="146" x2="301" y2="264" stroke="#122120" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="226" text-anchor="end" fill="#0D6E63">λ / П, N</text>
  <line x1="422" y1="146" x2="339" y2="264" stroke="#122120" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="226" text-anchor="start" fill="#0D6E63">λ / Н, N</text>
  <circle cx="320" cy="290" r="32" fill="#FBEBD0" stroke="#122120" stroke-width="1.5"/>
  <circle cx="320" cy="290" r="26" fill="none" stroke="#122120" stroke-width="1.5"/>
  <text x="320" y="291" text-anchor="middle" dominant-baseline="middle" font-size="18">!</text>
  <text x="320" y="346" text-anchor="middle" font-size="13" fill="#6B8480">q₀ — стерто парну кількість одиниць, q₁ — непарну</text>
</svg>
