<path d="M 436 348 H 416 V 388 H 436" fill="none" stroke="#122120" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M 376 368 H 416" fill="none" stroke="#6B8480" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="370" y="358" width="12" height="20" fill="#ffffff" stroke="#122120" stroke-width="1.5"/>
<text x="456" y="358" text-anchor="start">Коментар —</text>
<text x="456" y="380" font-size="14" text-anchor="start">пояснення</text>
