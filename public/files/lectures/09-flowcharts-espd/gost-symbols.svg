<path d="M 36 348 H 84 L 72 388 H 24 Z" fill="#ffffff" stroke="#122120" stroke-width="1.5" stroke-linejoin="miter"/>
<text x="104" y="358" text-anchor="start">Дані —</text>
<text x="104" y="380" font-size="14" text-anchor="start">введення/виведення</text>
