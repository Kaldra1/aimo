<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 558" width="720" height="558">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#122120"/></marker></defs>
<g font-family="Inter, Arial, sans-serif" font-size="15" fill="#122120" text-anchor="middle" dominant-baseline="middle">
<rect x="24" y="42" width="60" height="40" rx="20" fill="#ffffff" stroke="#122120" stroke-width="1.5"/>
<text x="104" y="52" text-anchor="start">Термінатор —</text>
<text x="104" y="74" font-size="14" text-anchor="start">початок/кінець</text>
